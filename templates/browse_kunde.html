<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find books</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="mainPage">

         <div class="backLink" id="backLink">

            <a href="/login">&larr;</a>

        </div>


        <h1>Browse books to borrow</h1>

        <h2>Logged in as, {{ session['epost'] }}</h2>

        <p class="borrowed_link" id="borrowLink">
            <a href="/login/browse_kunde/borrowed_kunde">See your borrowed books here.</a>
        </p>

        <div class="browse_books">
            <table>

                <tr class="Titles">
                    <th>Book name</th>
                    <th>Author</th>
                    <th>Available</th>
                    <th> - Borrow - </th>
                </tr>

                {% for c in boker %}
                <tr class="bookss">
                    <td>{{c[1]}}</td>
                    <td>{{c[2]}}</td>
                    <td>{{c[3]}}</td>
                    <td>
                        <div class="BorrowBTN" id="borrowBTN">
                            <a href="{{ url_for('borrow_book', bok_id=c[0]) }}"
                                onclick="return confirm('Borrow this book? {{ c[1] }} by {{ c[2] }} ?');">Borrow
                                book</a>

                        </div>
                    </td>
                </tr>
                {% endfor %}

            </table>

            <div class="faq_button">
                Got questions? Visit our FAQ page <a href="{{ url_for('faq_kunde') }}">here</a>
            </div>


        </div>
    </div>

</body>

</html>
