<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit user</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="backLink" id="backLink">

        <a href="/login">&larr;</a>

    </div>

    <h1>Edit User Information: </h1>
    <form method="POST" action="{{ url_for('edit_kunde') }}">

        <input type="hidden" name="id" value="{{ c[0] }}">

        <label for="fornavn">First name:</label><br>
        <input type="name" name="fornavn" value="{{ c[1] }}"><br><br>

        <label for="etternavn">Last name:</label><br>
        <input type="name" name="etternavn" value="{{ c[2] }}"><br><br>

        <label for="epost">E-mail:</label><br>
        <input type="email" name="epost" value="{{ c[3] }}"><br><br>

        <label for="telefonnummer">Phone Number:</label><br>
        <input type="telefonnummer" name="telefonnummer" value="{{ c[4] }}"><br><br>


        <button type="submit">Update User</button>
    </form>


</body>
</html>
