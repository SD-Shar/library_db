<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit user</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <h1>Edit user information</h1>

    <form method="POST" action="{{ url_for('update_kunde') }}">

        <input type="hidden" name="id" value="{{ cid }}">

        <label for="fornavn">First name:</label><br>
        <input type="name" name="fornavn" value="{{ bruker[0] }}" required><br><br>

        <label for="etternavn">Last name:</label><br>
        <input type="name" name="etternavn" value="{{ bruker[1] }}" required><br><br>

        <label for="epost">E-mail:</label><br>
        <input type="email" name="epost" value="{{ bruker[2] }}" required><br><br>

        <label for="tlf">Phone Number:</label><br>
        <input type="number" name="telefonnummer" value="{{ bruker[3] }}" required><br><br>

        <button type="submit">Update user</button>
    </form>

    
</body>
</html>
